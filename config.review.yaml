# Read-only review of PCD frames that have already been registered in map coordinates.
# Paths may be absolute or relative to this YAML file.
mode: review
global_map_path: ./data/global_map.pcd
registered_cloud_path: ./data/registered_frames
# Optional same-stem exported YAML files; each must contain corrected_T_map_lidar.
# If omitted, unavailable, or missing for a frame, the registered cloud median is used.
registered_pose_path: ./alignment_output/yaml
frame_id: "1781158324500077000"

display:
  map_roi_radius_m: 35.0
  display_voxel_m: 0.05
  slice_half_length_m: 20.0
  slice_thickness_m: 0.20
