# Paths may be absolute or relative to this YAML file.
# Create output_path_yaml (and output_path_pcd when enabled) before exporting.
mode: register  # register | review
global_map_path: ./data/global_map.pcd
frame_cloud_map_path: ./data/frames
initial_pose_path: ./data/poses
frame_id: "1781158324500077000"

output_path_yaml: ./alignment_output/yaml
output_path_pcd: ./alignment_output/pcd

display:
  map_roi_radius_m: 35.0
  display_voxel_m: 0.05
  slice_half_length_m: 20.0
  slice_thickness_m: 0.20

  clouds:
    global:
      mode: uniform
      color: "#90A4AE"
      cmap: viridis
      scalar: z
      range: auto
    source:
      mode: uniform
      color: "#F6C445"
      cmap: plasma
interaction:
  # Register mode only. Set true to enable 6DoF controls and ICP.
  allow_manual_adjustment: true
  translation_step_m: 0.01
  translation_large_step_m: 0.10
  rotation_step_deg: 0.02
  rotation_large_step_deg: 0.50

error:
  method: nearest_neighbor
  evaluation_radius_m: 25.0
  match_threshold_m: 0.2
